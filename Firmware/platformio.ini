; ============================================================================
; Easy Bee Counter 2026 — ESP32-C6 mini firmware
; ============================================================================
; Target board: Seeed XIAO ESP32C6 (Seeed part 113991054, schematic symbol
; "ESP32 C6 mini") on the easy-bee-counter-2026 PCB.
;
; The XIAO exposes silk-labelled pins D0..D10 that map to GPIO numbers in a
; non-trivial way (silk D4 is GPIO22, not GPIO4, and GPIO3..GPIO15 are not
; broken out at all). We build against the seeed_xiao_esp32c6 board, i.e. the
; real module: its variant (XIAO_ESP32C6) declares 4MB of flash — matching the
; chip on the PCB and the partition table below — and defines D0..D10 as plain
; constants for the GPIOs above. It does NOT enable the Arduino core's pin
; remapping (no BOARD_HAS_PIN_REMAP), so Arduino pin numbers are still raw GPIO
; numbers and every PCB-specific assignment in include/pins.h stays written as a
; physical GPIO number — never a silk number. See the mapping table at the top
; of that file.
; ============================================================================

; Settings shared by every build environment. The single concrete env below
; inherits these.
[env]
platform        = espressif32
board           = seeed_xiao_esp32c6
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; Name the build products after the board and the version in include/version.h
; (hivetraffic_esp32-c6_<version>.bin) instead of the generic firmware.bin.
; HiveHub's firmware upload form reads the target, board and version straight
; out of that filename, so the image can be uploaded as-is; see
; rename_firmware.py for the naming contract and who else depends on it.
extra_scripts = pre:rename_firmware.py

; Use the USB CDC (USB-Serial-JTAG) for Serial output and flashing — the
; ESP32-C6 mini exposes USB on the standard pins; we want Serial.print()
; to come out on USB without needing an external USB-UART bridge.
; (The XIAO board definition already sets the first two; they are repeated here
; so the intent survives a board change.)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2

; ---------------------------------------------------------------------------
; Production firmware — the only build.
;
; The counter is a connectable NimBLE GATT peripheral: HiveHub reads one JSON
; measurement characteristic per upload cycle and can stream a firmware image
; into the OTA characteristics. See src/ble_link.cpp and docs/ble-mode.md.
;
; The old wired I2C slave link to a HiveScale has been removed entirely — there
; is no build that speaks it, and HiveHub dropped its wired counter client. The
; -DBEECOUNTER_BLE switch that used to select between the two is gone with it.
;
; Power note: the counter's draw is dominated by pulsing the 48 IR emitters, so
; keeping the radio advertising-connectable adds some average current.
; Advertising is therefore slowed to one second and JSON is built on demand.
;
;     pio run -t upload
;
; The bench IR-sensor console in main.cpp (-DIR_DEBUG) no longer has an
; environment of its own. Compile it ad hoc when bringing up hardware:
;     PLATFORMIO_BUILD_FLAGS=-DIR_DEBUG pio run -t upload
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32c6]
; Dual app slots are required: BLE OTA writes the inactive slot, verifies the
; complete size and CRC-32, then asks the ESP bootloader to select it.
board_build.partitions = partitions_4mb_ota_no_fs.csv
lib_deps =
    ${env.lib_deps}
    ; BLE: NimBLE 2.x — the version that supports the ESP32-C6 radio
    ; (same library and major version HiveInside uses).
    h2zero/NimBLE-Arduino@^2.2.0
