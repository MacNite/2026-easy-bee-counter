; ============================================================================
; Easy Bee Counter 2026 — ESP32-C6 mini firmware
; ============================================================================
; Target board: ESP32-C6-MINI-1 module on the easy-bee-counter-2026 PCB.
;
; The C6 mini exposes silk-labelled pins D0..D10 that map to GPIO numbers
; in a non-trivial way. This firmware uses Arduino-pin numbers via the
; framework-arduinoespressif32 variant header for esp32-c6-devkitc-1, but
; the PCB-specific pin assignments are *all* centralised in include/pins.h
; and refer to physical GPIO numbers — see the comments there.
; ============================================================================

; Settings shared by every build environment. The two concrete envs below
; (production + IR-debug) inherit these and only differ in build_flags.
[env]
platform        = espressif32
board           = esp32-c6-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; Use the USB CDC (USB-Serial-JTAG) for Serial output and flashing — the
; ESP32-C6 mini exposes USB on the standard pins; we want Serial.print()
; to come out on USB without needing an external USB-UART bridge.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    adafruit/Adafruit MCP23017 Arduino Library @ ^2.3.2

; ---------------------------------------------------------------------------
; Production firmware — the default build.
;
; The counter is a connectable NimBLE GATT peripheral: HiveHub reads one JSON
; measurement characteristic per upload cycle and can stream a firmware image
; into the OTA characteristics. See src/ble_link.cpp and docs/ble-mode.md.
;
; The old wired I2C slave link to a HiveScale has been removed entirely — there
; is no build that speaks it, and HiveHub dropped its wired counter client. The
; -DBEECOUNTER_BLE switch that used to select between the two is gone with it.
;
; Power note: the counter's draw is dominated by pulsing the 48 IR emitters, so
; keeping the radio advertising-connectable adds some average current.
; Advertising is therefore slowed to one second and JSON is built on demand.
;
;     pio run -t upload
; ---------------------------------------------------------------------------
[env:esp32-c6-devkitc-1]
; Dual app slots are required: BLE OTA writes the inactive slot, verifies the
; complete size and CRC-32, then asks the ESP bootloader to select it.
board_build.partitions = partitions_4mb_ota_no_fs.csv
lib_deps =
    ${env.lib_deps}
    ; BLE: NimBLE 2.x — the version that supports the ESP32-C6 radio
    ; (same library and major version HiveInside uses).
    h2zero/NimBLE-Arduino@^2.2.0

; Bench/bring-up firmware. Identical to production but compiles in the
; interactive USB serial IR-sensor debug console (see main.cpp, -DIR_DEBUG).
; Build & flash with:
;     pio run -e esp32-c6-devkitc-1-irdebug -t upload
; then open the serial monitor and press 'h' for the command list.
[env:esp32-c6-devkitc-1-irdebug]
board_build.partitions = partitions_4mb_ota_no_fs.csv
build_flags =
    ${env.build_flags}
    -DIR_DEBUG
lib_deps =
    ${env:esp32-c6-devkitc-1.lib_deps}
